[package]
name = "accum-wallet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "accum-wallet"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# HTTP
reqwest = { version = "0.12", features = ["blocking", "json"] }
bytes = "1"

# Crypto
secp256k1 = { version = "0.28", features = ["rand", "serde"] }
sha2 = "0.10"
ripemd = "0.1"
hex = "0.4"
bs58 = "0.5"
bip39 = "2"
rand = "0.8"

# Utils
colored = "2"
dirs = "5"
thiserror = "1"